[package]
name = "cloakbrowser"
version = "0.1.0"
edition = "2021"
description = "Stealth Chromium launcher — Rust port of CloakBrowser (drop-in chromiumoxide-based automation with source-level fingerprint patches)"
license = "MIT"
repository = "https://github.com/CloakHQ/cloakbrowser"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# CDP client / browser control
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], default-features = false }

# HTTP / download
reqwest = { version = "0.12", features = ["stream", "socks", "gzip"], default-features = false }

# Crypto / integrity
ed25519-dalek = "2"
sha2 = { version = "0.10", features = ["oid"] }
rsa = "0.9"
base64 = "0.22"

# Archives
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

# GeoIP
maxminddb = "0.24"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
dirs = "5"
rand = "0.8"
url = "2"
percent-encoding = "2"
tempfile = "3"
thiserror = "1"
tracing = "0.1"
regex = "1"
once_cell = "1"

# cloakserve HTTP+WS server (feature-gated)
axum = { version = "0.7", features = ["ws"], optional = true }
tokio-tungstenite = { version = "0.24", optional = true }
hyper = { version = "1", optional = true }
dashmap = { version = "6", optional = true }

[features]
default = ["rustls"]
rustls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
# CDP multiplexer server (cloakserve equivalent)
serve = ["dep:axum", "dep:tokio-tungstenite", "dep:hyper", "dep:dashmap"]

[dev-dependencies]
anyhow = "1"

[[example]]
name = "basic"
required-features = []
